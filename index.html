<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICWANA2027 | The 5th International Conference and Workshop on Applied Nonlinear Analysis</title>
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for LaTeX support -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(30, 58, 138, 0.88)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="sec-navbar"></div>
    <div id="sec-hero"></div>
    <div id="sec-about"></div>
    <div id="sec-dates-program"></div>
    <div id="sec-speakers"></div>
    <div id="sec-abstract-journals"></div>
    <div id="sec-registration-committees"></div>
    <div id="sec-footer"></div>

    <script>
        const sections = [
            { id: 'sec-navbar', file: 'navbar.html' },
            { id: 'sec-hero', file: 'hero.html' },
            { id: 'sec-about', file: 'about.html' },
            { id: 'sec-dates-program', file: 'dates-program.html' },
            { id: 'sec-speakers', file: 'speakers.html' },
            { id: 'sec-abstract-journals', file: 'abstract-journals.html' },
            { id: 'sec-registration-committees', file: 'registration-committees.html' },
            { id: 'sec-footer', file: 'footer.html' }
        ];

        Promise.all(sections.map(sec =>
            fetch(sec.file)
                .then(res => res.ok ? res.text() : '')
                .then(html => {
                    document.getElementById(sec.id).innerHTML = html;
                })
        )).then(() => {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
